{% extends "authenticated-base.html" %}
{% block title %}Submit review{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2">
  <section class="workspace-welcome">
    {% for message in get_flashed_messages(request) %}
    <div class="alert alert-{{ message.type }}" role="alert">{{ message.message }}</div>
    {% endfor %}

    <p class="landing-kicker">Completed stay</p>
    <h1 class="h2 mb-4">Submit review</h1>

    <div class="listing-card">
      <div class="listing-card-content">
        <h2 class="h5">{{ listing.address }}</h2>
        <form method="post" action="{{ url_for('submit_review', booking_id=booking.id) }}">
          <div class="mb-3">
            <label class="form-label" for="rating">Rating (1 to 5)</label>
            <select class="form-select" id="rating" name="rating" required>
              <option value="">Choose a rating</option>
              {% for value in range(1, 6) %}
              <option value="{{ value }}">{{ value }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="comment">Written review</label>
            <textarea class="form-control" id="comment" name="comment" rows="6" required></textarea>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary" type="submit">Submit review</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('student_applications') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </section>
</div>
{% endblock %}
