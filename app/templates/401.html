{% extends "base.html" %}
{% block title %}Sign in required{% endblock %}

{% block content %}
<main class="auth-shell">
  <section class="auth-panel">
    <a class="brand-lockup" href="{{ url_for('index_view') }}">
      <img class="brand-mark" src="{{ url_for('static', path='img/brand-dog-kennel.svg') }}" alt="">
      <span class="brand-wordmark">Student Accommodation</span>
    </a>
    <p class="error-code">401</p>
    <h1>Sign in required</h1>
    <p class="auth-tagline">Your session may have expired. Sign in to continue.</p>
    <a class="btn btn-primary w-100" href="{{ url_for('login_view') }}">Return to sign in</a>
  </section>
</main>
{% endblock %}
