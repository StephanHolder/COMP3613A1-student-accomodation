[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

# Metadata only — install runtime deps with: pip install -r requirements.txt
[project]
name = "project-starter"
version = "0.0.1"
description = "COMP 3613 FastStarter assignment starter (FastAPI + SQLModel)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kwasi Edwards", email = "kwasiedwards@gmail.com" }
]
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
markers = [
    "unit: service and utility modules tested in isolation (mocked repositories, no database)",
    "integration: routes, services and repositories together on an in-memory SQLite database",
]

[tool.setuptools]
packages = ["app"]
